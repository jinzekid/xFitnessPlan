<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fitness Plan - Workout Planning</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 24px;
        background: #0f172a;
        color: #f8fafc;
      }
      .wrap {
        max-width: 920px;
        margin: 0 auto;
      }
      .card {
        background: linear-gradient(135deg, #111827, #1f2937);
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 30px;
        letter-spacing: 0.2px;
      }
      h2 {
        margin: 24px 0 8px 0;
        font-size: 20px;
      }
      p, li {
        margin: 6px 0;
        line-height: 1.6;
        color: #e2e8f0;
      }
      .muted {
        color: #94a3b8;
        font-size: 14px;
      }
      .grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        margin-top: 16px;
      }
      .feature {
        background: rgba(148, 163, 184, 0.12);
        border-radius: 12px;
        padding: 16px;
      }
      a {
        color: #38bdf8;
        text-decoration: none;
      }
      .cta {
        margin-top: 20px;
        padding: 12px 16px;
        background: #22c55e;
        border-radius: 10px;
        display: inline-block;
        color: #052e16;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Fitness Plan</h1>
        <p>轻松规划训练，记录每次训练，保持稳定进步。</p>
        <p class="muted">Plan workouts, track sessions, and stay consistent.</p>

        <div class="grid">
          <div class="feature">
            <h2>训练计划</h2>
            <p>分组动作、组数与休息时间清晰管理。</p>
          </div>
          <div class="feature">
            <h2>训练记录</h2>
            <p>自动保存每次训练时长与完成情况。</p>
          </div>
          <div class="feature">
            <h2>每周安排</h2>
            <p>把计划安排到具体日期，养成节奏。</p>
          </div>
          <div class="feature">
            <h2>高级订阅</h2>
            <p>解锁更多计划数量与进阶功能。</p>
          </div>
        </div>

        <p class="muted" style="margin-top: 20px;">
          联系我们 / Contact: <a href="mailto:sherlock_apps@163.com">sherlock_apps@163.com</a>
        </p>
        <a class="cta" href="index.html">Support</a>
      </div>
    </div>
  </body>
</html>
